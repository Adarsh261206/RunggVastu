<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17140F"/>
      <stop offset="0.55" stop-color="#101A15"/>
      <stop offset="1" stop-color="#0B2E22"/>
